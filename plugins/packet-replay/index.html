<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Packet Replay</title>
  <style>
    :root {
      --bg: #16171f; --panel: #1e1f2e; --border: rgba(156,163,175,0.15);
      --text: #e2e8f0; --muted: rgba(255,255,255,0.45);
      --accent: #34d399; --send: #fbbf24; --err: #ef4444;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; flex-direction: column; overflow: hidden; }

    .bar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
    .bar h1 { font-size: 14px; margin: 0; display: flex; align-items: center; gap: 8px; flex: 1; }
    .bar h1 .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

    .scroll { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
    .label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 5px; }

    input, textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
      padding: 7px 9px; color: #fff; font-size: 12px; font-family: inherit; }
    textarea { font-family: "SF Mono", Consolas, monospace; resize: vertical; min-height: 48px; }
    input:focus, textarea:focus { outline: none; border-color: var(--accent); }
    .row2 { display: flex; gap: 8px; }
    .row2 > div { flex: 1; }
    .mt { margin-top: 9px; }

    .btns { display: flex; gap: 8px; margin-top: 10px; }
    .btn { padding: 7px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; border: 1px solid var(--border);
      background: transparent; color: var(--muted); cursor: pointer; transition: all .15s ease; }
    .btn:hover { color: var(--text); border-color: rgba(156,163,175,0.35); }
    .btn.primary { background: rgba(52,211,153,0.18); color: var(--accent); border-color: transparent; }
    .btn.primary:hover { background: rgba(52,211,153,0.3); }
    .btn.send { background: rgba(251,191,36,0.18); color: var(--send); border-color: transparent; }
    .btn.send:hover { background: rgba(251,191,36,0.3); }

    .exp .name { font-size: 13px; font-weight: 700; }
    .exp .desc { font-size: 12px; color: var(--muted); margin: 4px 0 8px; line-height: 1.4; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; }
    th, td { text-align: left; padding: 3px 6px; border-bottom: 1px solid rgba(156,163,175,0.08); }
    th { color: var(--muted); font-weight: 600; font-size: 10px; text-transform: uppercase; }
    td.idx { color: rgba(255,255,255,0.3); width: 24px; font-family: monospace; }
    td.lab { width: 42%; }
    td.val { color: var(--accent); font-family: "SF Mono", Consolas, monospace; word-break: break-all; }

    .saved-item { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border: 1px solid var(--border);
      border-radius: 6px; margin-top: 6px; cursor: pointer; }
    .saved-item:hover { border-color: rgba(156,163,175,0.35); background: rgba(255,255,255,0.03); }
    .saved-item .si-name { font-weight: 600; font-size: 12px; }
    .saved-item .si-raw { font-family: "SF Mono", Consolas, monospace; font-size: 10px; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .saved-item .si-del { color: var(--muted); background: none; border: none; cursor: pointer; font-size: 12px; padding: 2px 6px; }
    .saved-item .si-del:hover { color: var(--err); }
    .muted-note { font-size: 11px; color: var(--muted); }
    #status { font-size: 12px; min-height: 16px; }
    #status.ok { color: var(--accent); } #status.err { color: var(--err); }
  </style>
</head>
<body>
  <div class="bar"><h1><span class="dot"></span> Packet Replay</h1></div>

  <div class="scroll">
    <!-- Editor -->
    <div class="card">
      <div class="row2">
        <div>
          <div class="label">Name</div>
          <input id="pname" placeholder="e.g. Join Jamaa Township">
        </div>
      </div>
      <div class="mt">
        <div class="label">Packet</div>
        <textarea id="raw" placeholder="%xt%o%rj%..."></textarea>
      </div>
      <div class="mt">
        <div class="label">Note (optional)</div>
        <input id="note" placeholder="What this packet is for">
      </div>
      <div class="btns">
        <button class="btn primary" id="explainBtn">Explain</button>
        <button class="btn send" id="sendBtn">Send</button>
        <button class="btn" id="saveBtn">Save</button>
      </div>
      <div id="status" class="mt"></div>
    </div>

    <!-- Explanation -->
    <div class="card exp" id="explainCard" style="display:none;">
      <div class="label">Explanation</div>
      <div class="name" id="exName"></div>
      <div class="desc" id="exDesc"></div>
      <div id="exFields"></div>
    </div>

    <!-- Saved -->
    <div class="card">
      <div class="label">Saved Packets</div>
      <div class="muted-note">Stored as files in the plugin's <code>saved</code> folder. Click one to load it.</div>
      <div id="savedList"></div>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
