<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Packet Inspector</title>
  <style>
    :root {
      --bg: #16171f;
      --panel: #1e1f2e;
      --panel2: #23243450;
      --border: rgba(156, 163, 175, 0.15);
      --text: #e2e8f0;
      --muted: rgba(255, 255, 255, 0.45);
      --in: #34d399;   /* incoming */
      --out: #fbbf24;  /* outgoing */
      --accent: #34d399;
      --err: #ef4444;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; flex-direction: column; overflow: hidden; }

    /* Top bar */
    .bar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
    .bar h1 { font-size: 14px; margin: 0; display: flex; align-items: center; gap: 8px; flex: 1; }
    .bar h1 .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
    .btn { padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; border: 1px solid var(--border);
      background: transparent; color: var(--muted); cursor: pointer; transition: all .15s ease; }
    .btn:hover { color: var(--text); border-color: rgba(156,163,175,0.3); }
    .btn.active { color: var(--accent); border-color: var(--accent); }
    .btn.warn.active { color: var(--out); border-color: var(--out); }

    /* Controls */
    .controls { display: flex; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); align-items: center; }
    .controls input { flex: 1; background: var(--panel); border: 1px solid var(--border); border-radius: 4px;
      padding: 6px 10px; color: #fff; font-size: 12px; }
    .controls input:focus { outline: none; border-color: var(--accent); }
    .seg { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .seg button { padding: 6px 10px; font-size: 11px; background: transparent; color: var(--muted); border: none; cursor: pointer; }
    .seg button.active { background: var(--panel); color: var(--text); }

    /* List */
    #list { flex: 1; min-height: 0; overflow-y: auto; font-family: "SF Mono", Consolas, monospace; }
    .row { display: flex; align-items: center; gap: 8px; padding: 5px 12px; font-size: 11px; cursor: pointer;
      border-bottom: 1px solid rgba(156,163,175,0.05); }
    .row:hover { background: rgba(255,255,255,0.04); }
    .row.selected { background: rgba(52,211,153,0.12); }
    .row .arrow { width: 12px; text-align: center; flex-shrink: 0; }
    .row.in .arrow { color: var(--in); }
    .row.out .arrow { color: var(--out); }
    .row .type { flex-shrink: 0; min-width: 46px; font-weight: 700; }
    .row.in .type { color: var(--in); }
    .row.out .type { color: var(--out); }
    .row .name { color: var(--muted); flex-shrink: 0; min-width: 130px; }
    .row .raw { flex: 1; color: rgba(255,255,255,0.55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .time { color: rgba(255,255,255,0.25); flex-shrink: 0; font-size: 10px; }
    .empty { text-align: center; color: var(--muted); padding: 30px; font-size: 12px; }

    /* Detail */
    #detail { height: 44%; min-height: 150px; border-top: 1px solid var(--border); background: var(--panel);
      display: flex; flex-direction: column; }
    #detail .head { display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px; }
    #detail .head .dname { font-size: 13px; font-weight: 700; }
    #detail .head .badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px; }
    #detail .head .badge.in { background: rgba(52,211,153,0.15); color: var(--in); }
    #detail .head .badge.out { background: rgba(251,191,36,0.15); color: var(--out); }
    #detail .desc { padding: 0 12px 8px; font-size: 12px; color: var(--muted); line-height: 1.4; }
    #detail .rawline { margin: 0 12px 8px; padding: 6px 8px; background: var(--bg); border: 1px solid var(--border);
      border-radius: 4px; font-family: "SF Mono", Consolas, monospace; font-size: 11px; color: #c9d1d9;
      display: flex; align-items: center; gap: 8px; }
    #detail .rawline code { flex: 1; overflow-x: auto; white-space: nowrap; }
    #detail .fields { flex: 1; overflow-y: auto; padding: 0 12px 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; }
    th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid rgba(156,163,175,0.08); }
    th { color: var(--muted); font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: .5px; }
    td.idx { color: rgba(255,255,255,0.3); width: 26px; font-family: monospace; }
    td.lab { color: var(--text); width: 42%; }
    td.val { color: var(--accent); font-family: "SF Mono", Consolas, monospace; word-break: break-all; }
    .placeholder { color: var(--muted); font-size: 12px; padding: 20px 12px; text-align: center; }
  </style>
</head>
<body>
  <div class="bar">
    <h1><span class="dot"></span> Packet Inspector</h1>
    <button id="pause" class="btn">Pause</button>
    <button id="clear" class="btn">Clear</button>
  </div>

  <div class="controls">
    <input type="text" id="search" placeholder="Filter by type, name, or content...">
    <div class="seg" id="dir">
      <button data-dir="all" class="active">All</button>
      <button data-dir="in">In</button>
      <button data-dir="out">Out</button>
    </div>
  </div>

  <div id="list"><div class="empty">Waiting for packets... play the game to see traffic.</div></div>

  <div id="detail">
    <div class="placeholder">Click a packet above to see what it means.</div>
  </div>

  <script src="index.js"></script>
</body>
</html>
